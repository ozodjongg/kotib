# Namuna: ilova + Postgres. TLS'ni host'dagi Caddy/nginx tugatadi va 127.0.0.1:8080 ga proksilaydi.
# Ishga tushirish: cp .env.example .env && (to'ldiring) && docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: secretary
      POSTGRES_DB: secretary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretary"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://secretary:${POSTGRES_PASSWORD}@db:5432/secretary?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080" # faqat lokal: tashqariga reverse proxy orqali
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  pgdata:
